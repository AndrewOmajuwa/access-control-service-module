spring:
  application:
    name: GATEWAY
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: openapi
          uri: http://localhost:${server.port}
          predicates:
          - Path=/v3/api-docs/**
          filters:
          - RewritePath=/v3/api-docs/(?<path>.*), /$\{path}/v3/api-docs

        - id: access-control-service
          uri: lb://access-control-service
          predicates:
            - Path=/access-control-service/**
          filters:
          - RewritePath=/access-control-service/(?<path>.*), /$\{path}

        - id: test-service
          uri: lb://test-service
          predicates:
            - Path=/test-service/**
          filters:
          - RewritePath=/test-service/(?<path>.*), /$\{path}
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}
    instance:
      hostname: localhost
server:
  port: 8080
springdoc:
  api-docs:
    groups:
      enabled: true
