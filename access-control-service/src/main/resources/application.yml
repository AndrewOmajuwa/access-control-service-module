spring:
  application:
    name: ACCESS-CONTROL-SERVICE
  datasource:
    url: jdbc:mysql://localhost:3306/access_control
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8090
  error:
    include-stacktrace: always

user:
  passwordClient: ${CLIENT_SECRET}
  clientId: ${CLIENT_ID}
  realm: ${REALM}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}
keycloak:
  realm: ${REALM}
  resource: access-control-service
  auth-server-url: http://localhost:8180
  ssl-required: external
  public-client: false

