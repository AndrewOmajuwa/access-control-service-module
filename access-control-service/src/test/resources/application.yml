spring:
  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password:
    driverClassName: org.h2.Driver
  jpa:
    spring.jpa.database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
user:
  token: ${TOKEN:}

keycloak:
  realm: devoteam
  resource: access-control-client
  auth-server-url: https://valhalla-keycloak.azurewebsites.net/auth/
  ssl-required: external
  public-client: false

eureka:
  client:
    enabled: false