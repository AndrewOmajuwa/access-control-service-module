version: '3.9'

services:
  mysql-kc:
    image: mysql:8.0.29
    ports:
      - 3306:3306
    restart: unless-stopped
    environment:
      # The user, password and database that Keycloak
      # is going to create and use
      MYSQL_USER: user
      MYSQL_PASSWORD: root_password
      MYSQL_DATABASE: keycloak_db
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - keycloak-and-mysql-volume:/var/lib/mysql
    networks:
      - keycloak-and-mysql-network

  keycloak-w:
    image: jboss/keycloak:16.1.1
    ports:
      - "8180:8080"
    restart: unless-stopped
    environment:
      # User and password for the Administration Console
      KEYCLOAK_USER: ${USERNAME_KEYCLOAK}
      KEYCLOAK_PASSWORD: ${PASSWORD_KEYCLOAK}
      DB_VENDOR: mysql
      DB_ADDR: mysql-kc
      DB_PORT: 3306
      # Same values as the mysql-kc service
      DB_USER: user
      DB_PASSWORD: root_password
      DB_DATABASE: keycloak_db
    depends_on:
      - mysql-kc
    networks:
      - keycloak-and-mysql-network

networks:
  keycloak-and-mysql-network:

volumes:
  keycloak-and-mysql-volume: